name: Release

# Triggered by a tag push (vX.Y.Z). Three jobs:
#   1. release      - create the GitHub Release with auto-generated notes
#   2. build-sdist  - build the source distribution (sdist only; the C++ /
#                     Metal extension is platform-specific and built on
#                     install, so we don't ship binary wheels yet)
#   3. publish-pypi - upload the sdist to PyPI via OIDC Trusted Publishing
#                     (no API tokens; scoped to the "pypi" environment so
#                     a maintainer must approve before upload)
#
# Setup required on PyPI side (one-time):
#   https://pypi.org/manage/project/turboquant-mlx-full/settings/publishing/
#   Add a Trusted Publisher:
#     - Owner:                manjunathshiva
#     - Repository name:      turboquant-mlx
#     - Workflow filename:    release.yml
#     - Environment name:     pypi
# Setup required on GitHub side (one-time):
#   Repo Settings -> Environments -> New environment "pypi" -> require
#   manual approval (so an unintended tag push can't auto-upload).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist
        run: python -m build --sdist

      - name: Check distribution metadata
        run: twine check dist/*

      # The same guard ci.yml runs, repeated here on the tarball that actually
      # gets published. `twine check` validates metadata, not contents: 0.17.0
      # and 0.18.0 both passed it while shipping without the `models/`
      # subpackage, which broke every console script on install. CI gates main
      # and tags come from main, so this is belt-and-braces — but this is the
      # job whose output reaches users, so this is where it must not be skipped.
      - name: Verify sdist carries every declared package
        run: |
          python - <<'PY'
          import glob, sys, tarfile, tomllib

          with open("pyproject.toml", "rb") as f:
              packages = tomllib.load(f)["tool"]["setuptools"]["packages"]
          tar = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(tar) as t:
              names = set(t.getnames())
          root = min(names, key=len).split("/")[0]

          missing = []
          for p in packages:
              sub = "" if p == "turboquant_mlx" else p.split(".", 1)[1]
              sub = sub.replace(".", "/")
              path = f"{root}/{sub}/__init__.py" if sub else f"{root}/__init__.py"
              if path not in names:
                  missing.append(f"{p} ({path})")
          if missing:
              sys.exit(f"sdist {tar} is missing declared package(s): {missing}")
          print(f"sdist carries all {len(packages)} declared packages")
          PY

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(python -c "import re; m=re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('__init__.py').read()); print(m.group(1))")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG does not match __version__ $PKG_VERSION" >&2
            exit 1
          fi
          echo "Tag v$TAG matches __version__ $PKG_VERSION"

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI (OIDC)
    needs: build-sdist
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/turboquant-mlx-full
    permissions:
      id-token: write
    steps:
      - name: Download sdist artifact
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Sdist only - the C++ extension is built per-host on install.
          # If we ever ship cibuildwheel-built wheels, add them to the
          # artifact and they'll upload automatically alongside the sdist.
          packages-dir: dist/
          skip-existing: true
