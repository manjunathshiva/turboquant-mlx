name: Docs

# Builds the documentation site from docs/ and publishes it to GitHub Pages.
# One-time setup: Settings -> Pages -> Source: GitHub Actions.

on:
  pull_request:
    paths: [docs/**, zensical.toml, requirements-docs.txt, .github/workflows/docs.yml]
  push:
    branches: [main]
    paths: [docs/**, zensical.toml, requirements-docs.txt, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

# Cancel outdated pull request builds; let an active deploy on main finish.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      # --strict fails on every warning, including links the site cannot resolve
      - run: zensical build --strict --clean
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    needs: build
    # Pages is configured on the canonical repository only; forks still run the strict build above.
    # Only main deploys: a manual run from another branch stays build-only.
    if: github.ref == 'refs/heads/main' && github.repository == 'manjunathshiva/turboquant-mlx'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
