name: CI

# Runs the test suite and verifies the sdist builds cleanly on every push
# and pull request to main. macOS-14 runners are GitHub-hosted Apple Silicon;
# MLX is Apple-Silicon-only, so we don't matrix over Linux.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        # The repo root IS the importable `turboquant_mlx` package (via the
        # `[tool.setuptools.package-dir]` mapping in pyproject.toml), so we
        # need a real install for tests to import it. Build isolation pulls
        # in setuptools>=64 + mlx per [build-system].requires automatically.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "mlx-lm>=0.10.0" pytest

      - name: Run tests
        # Skip the QJL unbiasedness test (pre-existing flake on RNG state) and
        # any test that requires downloading model weights from HuggingFace.
        run: |
          pytest tests/ -v \
            --deselect tests/test_core.py::test_qjl_unbiasedness \
            -k "not requires_model"

  build-sdist:
    name: build sdist
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist
          python -m twine check dist/*.tar.gz
      # The tests run from the source tree, so a subpackage missing from
      # pyproject's `packages` list passes every test and still ships broken
      # (0.17.0/0.18.0 shipped without `models/`, killing every console script
      # on a fresh install). Assert the artifact itself carries each one.
      - name: sdist contents
        run: |
          python - <<'PY'
          import glob, sys, tarfile, tomllib

          with open("pyproject.toml", "rb") as f:
              packages = tomllib.load(f)["tool"]["setuptools"]["packages"]
          tar = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(tar) as t:
              names = set(t.getnames())
          root = min(names, key=len).split("/")[0]

          missing = []
          for p in packages:
              sub = "" if p == "turboquant_mlx" else p.split(".", 1)[1]
              sub = sub.replace(".", "/")
              path = f"{root}/{sub}/__init__.py" if sub else f"{root}/__init__.py"
              if path not in names:
                  missing.append(f"{p} ({path})")
          if missing:
              sys.exit(f"sdist {tar} is missing declared package(s): {missing}")
          print(f"sdist carries all {len(packages)} declared packages")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 14
