[build-system]
requires = [
    "setuptools>=64",
    "wheel",
    "mlx>=0.20.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "turboquant-mlx-full"
version = "0.28.1"
description = "Extreme weight and KV cache compression for LLMs on Apple Silicon (MLX implementation of Google's TurboQuant)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Manjunath Janardhan", email = "manjunath.shiva@gmail.com"}]
keywords = [
    "mlx",
    "quantization",
    "llm",
    "kv-cache",
    "apple-silicon",
    "turboquant",
    "polarquant",
    "moe",
    "long-context",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mlx>=0.32.2",
    # 0.32.2 is the floor because 0.32 moved scalars into `state` (no more
    # `meta_state`) and ships its own kimi_k3/laguna modules; this package is
    # written against that API. Capped below 0.33 because serve.py, serve_vlm.py
    # and compat.py patch mlx-lm internals, and each minor release so far has
    # moved one of them — lift the cap only after the suite passes on 0.33.
    # (0.32 registers NewlineTokenizer by class, so the transformers 5.13
    # string-key break that needed `!=5.13.*` no longer applies.)
    "mlx-lm>=0.32.2,<0.33",
    "transformers",
    "numpy",
]

[project.optional-dependencies]
eval = ["datasets", "transformers"]
dev = ["pytest", "build", "twine"]
# 0.6.12 is where the RMS norm was hoisted out of Muse Glimmer's embedding
# (Blaizzy/mlx-vlm#1838): `TextModel` holds a paramless `embed_norm` and applies
# it in `__call__`, so a plain `QuantizedEmbedding` already keeps the maths right
# and `_patch_muse_glimmer_normed_embedding` is a no-op.
#
# NOT because muse_glimmer is absent below it — 0.6.11 carries the model classes
# and loads fine (measured). `integration/vlm.py` patches the pre-hoist layout
# and the on-disk key set is identical either way, so an existing <0.6.12
# environment is not broken. The floor stays here because this is the layout that
# needs no patch at all: the patch's own tests skip themselves on >= 0.6.12, so
# the pre-hoist path is not what CI exercises.
#
# 0.7.9 since the mlx-lm 0.32 port: 0.7.x replaced `suppress_tool_call_content`
# with `ToolCallStreamState`, and serve_vlm.py targets only the new layout.
vlm = ["mlx-vlm>=0.7.9"]
# Kimi K3 ships a tiktoken-based tokenizer that needs blobfile to load.
kimi = ["tiktoken", "blobfile"]

[project.urls]
Homepage = "https://github.com/manjunathshiva/turboquant-mlx"
Repository = "https://github.com/manjunathshiva/turboquant-mlx"
Issues = "https://github.com/manjunathshiva/turboquant-mlx/issues"

[project.scripts]
turboquant-convert = "turboquant_mlx.convert:main"
turboquant-generate = "turboquant_mlx.generate:main"
turboquant-serve = "turboquant_mlx.serve:main"
turboquant-serve-vlm = "turboquant_mlx.serve_vlm:main"
turboquant-plan = "turboquant_mlx.plan:main"
turboquant-doctor = "turboquant_mlx.plan:doctor_main"

# package-dir trick: the git repo root IS the importable `turboquant_mlx`
# package, so we map the package name to the current directory and explicitly
# enumerate subpackages.
[tool.setuptools]
packages = [
    "turboquant_mlx",
    "turboquant_mlx.core",
    "turboquant_mlx.layers",
    "turboquant_mlx.kernels",
    "turboquant_mlx.integration",
    "turboquant_mlx.models",
    "turboquant_mlx.stream",
    # Shipped so the README's and the model cards' reproduce commands
    # (`python -m turboquant_mlx.benchmarks.eval_vlm_perplexity ...`) work from
    # a pip install and not only from a git checkout. Pure scripts -- the
    # results JSONs beside them are records, and nothing reads one at runtime.
    "turboquant_mlx.benchmarks",
]
include-package-data = true

[tool.setuptools.package-dir]
"turboquant_mlx" = "."
"turboquant_mlx.core" = "core"
"turboquant_mlx.layers" = "layers"
"turboquant_mlx.kernels" = "kernels"
"turboquant_mlx.integration" = "integration"
