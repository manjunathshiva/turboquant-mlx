[build-system]
requires = [
    "setuptools>=64",
    "wheel",
    "mlx>=0.20.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "turboquant-mlx-full"
version = "0.21.0"
description = "Extreme weight and KV cache compression for LLMs on Apple Silicon (MLX implementation of Google's TurboQuant)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT", "NOTICE"]
authors = [{name = "Manjunath Janardhan", email = "manjunath.shiva@gmail.com"}]
keywords = [
    "mlx",
    "quantization",
    "llm",
    "kv-cache",
    "apple-silicon",
    "turboquant",
    "polarquant",
    "moe",
    "long-context",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mlx>=0.20.0",
    "mlx-lm>=0.31.3",
    # transformers 5.13 dropped string keys in AutoTokenizer.register, which
    # mlx-lm <= 0.31.3 still uses (NewlineTokenizer) at module scope — importing
    # mlx_lm.tokenizer_utils raises AttributeError. 5.14 restored string keys,
    # so the break is confined to the 5.13 series (verified against mlx-lm
    # 0.31.3: 5.12 OK, 5.13 FAIL, 5.14 OK, 5.15 OK). A `<5.13` cap would now
    # force the resolver to downgrade mlx-vlm, which needs >=5.14.
    "transformers!=5.13.*",
    "numpy",
]

[project.optional-dependencies]
eval = ["datasets", "transformers"]
dev = ["pytest", "build", "twine"]
# 0.6.12 is the first release carrying the Muse Glimmer model classes
# (Blaizzy/mlx-vlm#1838). Below that, `[vlm]` cannot load muse_glimmer.
vlm = ["mlx-vlm>=0.6.12"]
# Kimi K3 ships a tiktoken-based tokenizer that needs blobfile to load.
kimi = ["tiktoken", "blobfile"]

[project.urls]
Homepage = "https://github.com/manjunathshiva/turboquant-mlx"
Repository = "https://github.com/manjunathshiva/turboquant-mlx"
Issues = "https://github.com/manjunathshiva/turboquant-mlx/issues"

[project.scripts]
turboquant-convert = "turboquant_mlx.convert:main"
turboquant-generate = "turboquant_mlx.generate:main"
turboquant-serve = "turboquant_mlx.serve:main"
turboquant-serve-vlm = "turboquant_mlx.serve_vlm:main"
turboquant-plan = "turboquant_mlx.plan:main"
turboquant-doctor = "turboquant_mlx.plan:doctor_main"

# package-dir trick: the git repo root IS the importable `turboquant_mlx`
# package, so we map the package name to the current directory and explicitly
# enumerate subpackages.
[tool.setuptools]
packages = [
    "turboquant_mlx",
    "turboquant_mlx.core",
    "turboquant_mlx.layers",
    "turboquant_mlx.kernels",
    "turboquant_mlx.integration",
    "turboquant_mlx.models",
    "turboquant_mlx.stream",
]
include-package-data = true

[tool.setuptools.package-dir]
"turboquant_mlx" = "."
"turboquant_mlx.core" = "core"
"turboquant_mlx.layers" = "layers"
"turboquant_mlx.kernels" = "kernels"
"turboquant_mlx.integration" = "integration"
